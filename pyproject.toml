[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "agent-stoploss"
dynamic = ["version"]
description = "Stop AI agents from burning tokens on broken tools."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Nataliya Agafonova" }]
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]
keywords = ["llm-agents", "ai-agents", "token-cost", "circuit-breaker", "loop-detection", "retry", "finops"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Aerantrix/agent-stoploss"
Issues = "https://github.com/Aerantrix/agent-stoploss/issues"
Changelog = "https://github.com/Aerantrix/agent-stoploss/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Checked against claude-agent-sdk 0.2.189.
claude-agent-sdk = ["claude-agent-sdk>=0.2.189"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov>=5", "ruff>=0.6"]

[project.scripts]
agent-stoploss = "agent_stoploss.cli:main"

[tool.hatch.version]
path = "src/agent_stoploss/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_stoploss"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "docs", "README.md", "CHANGELOG.md", "LICENSE", "stoploss.example.yaml"]
exclude = ["tests/ui/node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
